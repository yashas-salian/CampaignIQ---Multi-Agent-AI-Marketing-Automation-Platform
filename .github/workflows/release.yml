name: Release

# Push a tag vX.Y.Z to publish a GitHub Release whose notes are that version's
# CHANGELOG.md section. Refuses if the tag, pyproject.toml and
# frontend/package.json disagree, or the changelog has no entry for it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions and extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          if [ "$py" != "$version" ] || [ "$js" != "$version" ]; then
            echo "::error::tag $version, pyproject.toml $py, frontend/package.json $js must match"; exit 1
          fi
          # Plain string matching (no regex escapes): the lines after
          # "## [X.Y.Z]" up to the next "## " heading or the link references.
          awk -v head="## [$version]" '
            index($0, head) == 1 { found=1; next }
            found && (index($0, "## ") == 1 || index($0, "[Unreleased]: ") == 1) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for [$version]"; exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "CampaignIQ $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
