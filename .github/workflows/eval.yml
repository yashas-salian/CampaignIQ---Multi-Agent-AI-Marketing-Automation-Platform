name: Eval

# Runs only when the Python pipeline or its config changes: every run spends
# ~100 calls of the shared free Groq budget, so frontend-only pushes skip it.
on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/eval.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # M7: the fine-tuned domain model (llama.cpp, CPU wheel) + its ~940 MB GGUF,
      # cached between runs. Without the HF secrets below the app falls back to Groq.
      - name: Restore domain model cache
        id: domain-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: domain-model-${{ hashFiles('src/finetune/MODEL_VERSION') }}
      - run: pip install -e ".[local-model]" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - run: python -m src.eval.run_eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # M7 fine-tuned domain classifier (private Hugging Face model repo).
          DOMAIN_MODEL_HF_REPO: ${{ secrets.DOMAIN_MODEL_HF_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          # Feasibility's community signal (Bluesky search, plus Mastodon when a
          # token is set). Without these the signal silently degrades to 0.
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          # Reddit on hold (API access blocked by policy changes) — leave
          # ENABLE_REDDIT false here even if REDDIT_* secrets get added later,
          # until the main plan says to turn it back on.
          ENABLE_REDDIT: "false"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          FORCE_FREE_TIER: "true"
          DRY_RUN: "true"
      # Save even when an earlier step failed (e.g. a Groq rate limit), so the
      # ~940 MB model isn't re-downloaded on every run until a job succeeds.
      - name: Save domain model cache
        if: always() && steps.domain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: domain-model-${{ hashFiles('src/finetune/MODEL_VERSION') }}
