name: Tests

# Free on every push: no Groq, no live Supabase, no network calls from the unit
# tests (a guard fails any test that tries). The Groq-backed quality eval stays
# in eval.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,mcp,observability]"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Local database for the RLS integration tests
        run: supabase db start
      - name: Unit + integration tests
        # Coverage floor: raise it as coverage grows, never lower it.
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Edge Function helper tests (Stripe signatures; Node runs TypeScript natively)
        run: node --test ../supabase/functions/_shared/stripe.test.ts
      - name: Dropdowns use the themed Select (native <select> popups ignore the site theme)
        run: |
          if grep -rn "<select" src --include=*.tsx | grep -v "components/Select.tsx"; then
            echo "::error::Use components/Select instead of a native <select>"; exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the site, desktop + phone)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
