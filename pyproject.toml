[project]
name = "ad-campaign-agent"
version = "0.1.0"
description = "Agentic ad campaign platform: idea -> feasibility -> audience -> creative -> distribution -> feedback loop"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<0.3",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "groq>=0.11,<1",
    "openai>=1.40,<2",
    "pytrends>=4.9,<5",
    "pandas==2.2.2",
    "praw>=7.7,<8",
    "atproto>=0.0.55",
    "resend>=2.4,<3",
    "supabase>=2.9,<3",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "cryptography>=42,<45",
    "Pillow>=10.0,<12",
    "sentence-transformers>=3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
