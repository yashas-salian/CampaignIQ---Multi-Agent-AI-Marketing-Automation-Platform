[project]
name = "ad-campaign-agent"
version = "0.8.0"
description = "Agentic ad campaign platform: idea -> feasibility -> audience -> creative -> distribution -> feedback loop"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<0.3",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "groq>=0.11,<1",
    "openai>=1.40,<2",
    "pytrends>=4.9,<5",
    "pandas==2.2.2",
    "praw>=7.7,<8",
    "atproto>=0.0.55",
    "resend>=2.4,<3",
    "supabase>=2.9,<3",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "cryptography>=42,<45",
    "Pillow>=10.0,<12",
    "sentence-transformers>=3,<4",
]

[project.optional-dependencies]
# M7: run the fine-tuned domain classifier locally on CPU. Install with
#   pip install -e ".[local-model]" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
# (prebuilt CPU wheels; without the index pip tries to compile llama.cpp).
local-model = ["llama-cpp-python>=0.3,<0.4"]
# M8: expose capabilities/ as an MCP server (python -m src.mcp_server.server).
mcp = ["mcp>=1.9,<2"]
# Tests: pytest -m "not integration" (no network, no DB); integration tests need
# a local Supabase Postgres (npx --prefix frontend supabase db start --workdir .).
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local Supabase Postgres from `supabase db start` (skipped when it is not running)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/finetune/*", "src/admin/*"]
